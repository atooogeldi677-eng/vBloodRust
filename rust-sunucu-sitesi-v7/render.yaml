# Render.com "Blueprint": GitHub'a yükle -> Render'da New > Blueprint seç -> repoyu bağla.
services:
  - type: web
    name: rust-sunucu-sitesi
    runtime: node
    plan: free            # 7/24 uyanık kalması için ücretli plana geç
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD      # Render panelinde kendi şifreni gir (SABİT)
        sync: false
      - key: PUBLIC_URL          # https://siteadin.com
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rust-db
          property: connectionString
databases:
  - name: rust-db
    plan: free
